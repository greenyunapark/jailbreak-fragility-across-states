name: Release usability check

on:
  push:
  pull_request:

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate public release contract
        run: python scripts/validate_release.py
      - name: Resolve requirements
        run: python -m pip install --dry-run -r requirements.txt

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import and CLI smoke test
        run: |
          python attacks/generate_suffixes.py --help
          python attacks/evaluate_operational_states.py --help
          python attacks/judge_responses.py --help
          python attacks/pair/generate_artifacts.py --help
          python attacks/pair/evaluate_operational_states.py --help
          python attacks/autodan/prepare_artifacts.py --help
          python attacks/autodan/evaluate_operational_states.py --help
          python scripts/test_protocol_smoke.py
